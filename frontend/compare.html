<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>N100 | Compare Companies</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div id="alertBox"></div>

<nav class="navbar navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <span class="navbar-brand">

            <i class="bi bi-bar-chart-fill"></i>

            Company Comparison

        </span>

        <a href="dashboard.html"
           class="btn btn-light">

            <i class="bi bi-house-fill"></i>

            Dashboard

        </a>

    </div>

</nav>

<div class="container mt-4">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">

                <i class="bi bi-building"></i>

                Compare Two Companies

            </h3>

        </div>

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-5">

                    <label class="form-label">

                        Company 1

                    </label>

                    <select id="company1"
                            class="form-select">
                    </select>

                </div>

                <div class="col-md-5">

                    <label class="form-label">

                        Company 2

                    </label>

                    <select id="company2"
                            class="form-select">
                    </select>

                </div>

                <div class="col-md-2 d-grid">

                    <label>&nbsp;</label>

                    <button
                        class="btn btn-success"
                        onclick="compareCompanies()">

                        <i class="bi bi-arrow-left-right"></i>

                        Compare

                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="card shadow mt-4 border-success">

        <div class="card-header bg-success text-white">

            <h4 class="mb-0">

                🏆 Comparison Summary

            </h4>

        </div>

        <div class="card-body">

            <p id="winnerSales"></p>

            <p id="winnerProfit"></p>

            <p id="winnerROE"></p>

            <p id="winnerDebt"></p>

            <hr>

            <h3 id="overallWinner"
                class="text-primary fw-bold text-center">
            </h3>

        </div>

    </div>

    <div class="card shadow mt-4">

        <div class="card-header bg-dark text-white">

            <h5 class="mb-0">

                Comparison Table

            </h5>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-striped text-center">

                    <thead class="table-dark">

                        <tr>

                            <th>Metric</th>

                            <th id="companyName1">Company 1</th>

                            <th id="companyName2">Company 2</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <th>Sales</th>

                            <td id="sales1"></td>

                            <td id="sales2"></td>

                        </tr>

                        <tr>

                            <th>Net Profit</th>

                            <td id="profit1"></td>

                            <td id="profit2"></td>

                        </tr>

                        <tr>

                            <th>ROE</th>

                            <td id="roe1"></td>

                            <td id="roe2"></td>

                        </tr>

                        <tr>

                           <th>ROCE</th>
<td id="roce1"></td>
<td id="roce2"></td>

                        </tr>

                        <tr>

                            <th>Debt / Equity</th>

                            <td id="debt1"></td>

                            <td id="debt2"></td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

   <!-- Financial Performance -->
<div class="card shadow mt-4">

    <div class="card-header bg-info text-white">
        <h5 class="mb-0">
            <i class="bi bi-bar-chart-fill"></i>
            Financial Performance Comparison
        </h5>
    </div>

    <div class="card-body">
        <canvas id="compareChart"></canvas>
    </div>

</div>

<!-- Financial Ratios -->
<div class="card shadow mt-4">

    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
            <i class="bi bi-graph-up-arrow"></i>
            Financial Ratio Comparison
        </h5>
    </div>

    <div class="card-body">
        <div style="height:400px">
            <canvas id="ratioChart"></canvas>
        </div>
    </div>

</div>
    <div class="text-center mt-4">

        <button
            onclick="window.print()"
            class="btn btn-info">

            <i class="bi bi-printer-fill"></i>

            Print Report

        </button>

        <a href="dashboard.html"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>

</div>

<div id="loader" class="loader">

    <div class="spinner-border text-primary"></div>

</div>

<footer class="text-center py-3 mt-5 bg-light">
    <small>© 2026 N100 Financial Intelligence Platform | Developed by Ampolu Rajkumar </small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Chart Data Labels Plugin -->


<script src="js/common.js"></script>
<script src="js/compare.js"></script>
</body>

</html>
