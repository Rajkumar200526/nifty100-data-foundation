<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Company Details</h3>

        </div>

        <div class="card-body">

            <h4 id="companyName"></h4>

            <hr>

            <p><strong>Sector:</strong> <span id="sector"></span></p>

            <p><strong>Investment Score:</strong> <span id="score"></span></p>

            <p><strong>Recommendation:</strong> <span id="recommendation"></span></p>

            <p><strong>Rank:</strong> <span id="rank"></span></p>

            <div class="mt-4">

                <a id="ratioLink" href="#" class="btn btn-primary">
                    View Financial Ratios
                </a>

                <a id="compareLink" class="btn btn-warning">
                Compare Company
                </a>

                <a href="dashboard.html" class="btn btn-secondary">
                    Back
                </a>

            </div>

        </div>

    </div>

</div>

<script src="js/company.js"></script>

</body>
</html>
