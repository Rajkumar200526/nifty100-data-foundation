<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N100 Financial Intelligence Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        N100 Financial Intelligence Platform
    </h2>

    <!-- KPI Cards -->
    <div class="row mb-4">

        <div class="col-md-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Total Companies</h5>
                    <h2 id="companies">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Average Score</h5>
                    <h2 id="avgscore">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Highest Score</h5>
                    <h2 id="highest">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Lowest Score</h5>
                    <h2 id="lowest">0</h2>
                </div>
            </div>
        </div>

    </div>

    <!-- Search -->
    <div class="row mb-3">
        <div class="col-md-6">
            <input
                type="text"
                id="searchBox"
                class="form-control"
                placeholder="Search Company">
        </div>
    </div>

    <!-- Company Table -->
    <div class="card shadow">

        <div class="card-header">
            Top Ranked Companies
        </div>

        <div class="card-body">

            <table class="table table-striped table-hover">

                <thead class="table-dark">
                    <tr>
                        <th>Rank</th>
                        <th>Company</th>
                        <th>Sector</th>
                        <th>Investment Score</th>
                        <th>Recommendation</th>
                    </tr>
                </thead>

                <tbody id="tableBody">

                </tbody>

            </table>

        </div>

    </div>

    <!-- Investment Score Chart -->
    <div class="card shadow mt-4">

        <div class="card-header">
            Investment Score
        </div>

        <div class="card-body">
            <canvas id="scoreChart"></canvas>
        </div>

    </div>

    <!-- Pie Charts -->
    <div class="row mt-4">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header">
                    Sector Distribution
                </div>

                <div class="card-body">
                    <canvas id="sectorChart"></canvas>
                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header">
                    Recommendation Distribution
                </div>

                <div class="card-body">
                    <canvas id="recommendChart"></canvas>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
