<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <a id="backButton" href="#" class="btn btn-secondary mb-3">
    ← Back
</a>

    <h2 id="companyName">Recommendation</h2>

    <div class="card shadow mt-3">

        <div class="card-body">

            <h4>
                Recommendation:
                <span id="recommendationBadge" class="badge bg-primary"></span>
            </h4>

            <hr>
            <div class="alert alert-info mt-3">

    <strong>Analysis:</strong>

    <p id="recommendationText" class="mb-0"></p>

</div>
<h5 class="mt-4">Financial Health Score</h5>

<div class="progress" style="height:30px;">

    <div id="scoreBar"
         class="progress-bar progress-bar-striped progress-bar-animated"
         role="progressbar"
         style="width:0%">
        0%
    </div>

</div>

<br>

            <p><strong>Score:</strong> <span id="score"></span></p>
            <p><strong>ROE:</strong> <span id="roe"></span></p>
            <p><strong>ROCE:</strong> <span id="roce"></span></p>
            <p><strong>Debt / Equity:</strong> <span id="debt"></span></p>
            <p><strong>Free Cash Flow:</strong> <span id="fcf"></span></p>

        </div>

    </div>
    <div class="card shadow mt-4">

    <div class="card-header bg-primary text-white">

        Financial Metrics

    </div>

    <div class="card-body">

        <canvas id="financialChart"></canvas>

    </div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/recommendation.js"></script>

</body>
</html>
