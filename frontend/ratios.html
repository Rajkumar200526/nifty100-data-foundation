<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Financial Analysis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Financial Analysis Dashboard</h3>

        </div>

        <div class="card-body">

            <h2 id="companyName" class="text-primary"></h2>

            <hr>

            <!-- Financial Ratios Table -->

            <table class="table table-bordered table-striped">

                <tbody>

                    <tr>
                        <th>ROE</th>
                        <td id="roe"></td>
                    </tr>

                    <tr>
                        <th>ROA</th>
                        <td id="roa"></td>
                    </tr>

                    <tr>
                        <th>Debt / Equity</th>
                        <td id="debt"></td>
                    </tr>

                    <tr>
                        <th>Current Ratio</th>
                        <td id="current"></td>
                    </tr>

                    <tr>
                        <th>P/E Ratio</th>
                        <td id="pe"></td>
                    </tr>

                    <tr>
                        <th>EPS</th>
                        <td id="eps"></td>
                    </tr>

                    <tr>
                        <th>Market Cap</th>
                        <td id="marketcap"></td>
                    </tr>

                </tbody>

            </table>

            <hr>

            <h3 class="text-center mb-4">
                Financial Trends (2020 - 2024)
            </h3>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5 class="text-center">
                                Sales Trend
                            </h5>

                            <canvas id="salesChart"></canvas>

                        </div>

                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5 class="text-center">
                                Net Profit Trend
                            </h5>

                            <canvas id="profitChart"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5 class="text-center">
                                ROE Trend
                            </h5>

                            <canvas id="roeChart"></canvas>

                        </div>

                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5 class="text-center">
                                Free Cash Flow Trend
                            </h5>

                            <canvas id="fcfChart"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <a href="dashboard.html" class="btn btn-secondary mt-3">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- JavaScript -->
<script src="js/ratios.js"></script>

</body>
</html>
