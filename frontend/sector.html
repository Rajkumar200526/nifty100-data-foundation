<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">N100 Financial Intelligence Platform</a>

            <a href="dashboard.html" class="btn btn-outline-light">
                ⬅ Dashboard
            </a>
        </div>
    </nav>

    <div class="container mt-4">

        <h2 class="mb-4">📊 Sector Analytics Dashboard</h2>
      <div class="row mb-3">

    <div class="col-md-4">

        <label class="form-label fw-bold">
            Filter by Sector
        </label>

        <select id="sectorFilter" class="form-select">
            <option value="All">All Sectors</option>
        </select>

    </div>

    <div class="col-md-4">

        <label class="form-label fw-bold">
            Search Sector
        </label>

        <input
            type="text"
            id="searchSector"
            class="form-control"
            placeholder="Search sector..."
        >

    </div>

</div>
        <div class="row mb-4">

    <div class="col-md-4">
        <div class="card text-bg-primary shadow">
            <div class="card-body text-center">
                <h5>Total Sectors</h5>
                <h2 id="totalSectors">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-bg-success shadow">
            <div class="card-body text-center">
                <h5>Total Companies</h5>
                <h2 id="totalCompanies">0</h2>
            </div>
        </div>
    </div>

   <div class="col-md-4">
    <div class="card text-bg-warning shadow">
        <div class="card-body text-center">
            <h5>Highest Avg ROE</h5>
            <h2 id="highestROE">0%</h2>
        </div>
    </div>
</div>
</div>
<!-- Analytics Table -->
<div class="card shadow">
            <div class="card-header bg-primary text-white">
                Sector Statistics
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead class="table-dark text-center">

                            <tr>

                                <th>Sector</th>
                                <th>No. of Companies</th>
                                <th>Average Sales</th>
                                <th>Average Net Profit</th>
                                <th>Average ROE (%)</th>

                            </tr>

                        </thead>

                        <tbody id="sectorTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <br>

        <!-- Chart -->
        <div class="card shadow">

            <div class="card-header bg-success text-white">
                Sector Comparison Chart
            </div>

            <div class="card-body">

                <div style="height:450px;">

<div class="mx-auto" style="max-width:700px;height:500px;">
    <canvas id="sectorChart"></canvas>
</div>
                </div>

            </div>

        </div>

    </div>

   <script src="js/auth.js"></script>
<script src="js/sector.js"></script>

</body>

</html>
