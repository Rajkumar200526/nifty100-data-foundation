<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>N100 Financial Intelligence Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>N100 Financial Intelligence Platform</h2>

        <button class="btn btn-danger"
                onclick="logout()">

            Logout

        </button>

    </div>

    <!-- Dashboard Cards -->

    <div class="row mb-4">

        <div class="col-md-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5>Total Companies</h5>

                    <h2 id="totalCompanies">0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5>Total Clusters</h5>

                    <h2 id="totalClusters">0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5>Average ROE</h5>

                    <h2 id="averageROE">0</h2>

                </div>

            </div>

        </div>

    </div>

    <!-- Search -->

    <div class="mb-3">

        <input
                type="text"
                id="searchBox"
                class="form-control"
                placeholder="Search Company...">

    </div>

    <!-- Company Table -->
     <div class="row mb-4">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header">
                Investment Score Analysis
            </div>

            <div class="card-body">

                <canvas id="scoreChart"></canvas>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow">

            <div class="card-header">
                Sector Distribution
            </div>

            <div class="card-body">

                <canvas id="sectorChart"></canvas>

            </div>

        </div>

    </div>

</div>

    <div class="card shadow">

        <div class="card-header">

            <h4>Company Ranking</h4>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>

                    <th>Rank</th>

                    <th>Company</th>

                    <th>Sector</th>

                    <th>Investment Score</th>

                </tr>

                </thead>

                <tbody id="companyTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Dashboard JS -->
<script src="js/dashboard.js"></script>

</body>

</html>
