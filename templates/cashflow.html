{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">💰 Cash Flow Intelligence</h2>

<table class="table table-striped table-bordered">

    <thead class="table-info">
        <tr>
            {% for column in data[0].keys() %}
            <th>{{ column }}</th>
            {% endfor %}
        </tr>
    </thead>

    <tbody>
        {% for row in data %}
        <tr>
            {% for value in row.values() %}
            <td>{{ value }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>

</table>

{% endblock %}
